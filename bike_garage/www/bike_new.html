<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token|e }}"><title>{{ title|e }}</title><link rel="stylesheet" href="/assets/bike_garage/css/garage_ui.css">
<style>.record-form{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.record-form .wide{grid-column:1/-1}.record-form label{display:block;font-weight:600;margin:16px 0 6px}.record-form input,.record-form select,.record-form textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd3dc;border-radius:6px;font:inherit}.record-form textarea{min-height:90px}.record-notice{padding:12px;margin:12px 0;border-radius:6px}.record-notice.error{background:#fff0ef;color:#8b1a12}.record-notice.success{background:#e9f7ee;color:#14532d}.record-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}@media(max-width:560px){.record-form{grid-template-columns:1fr}.record-form .wide{grid-column:auto}}</style></head>
<body class="bg-job-page"><main class="bg-job-shell"><a class="bg-job-back" href="/garage">← Back to Dashboard</a><section class="bg-job-panel"><h1>Add Bike</h1>{% if not customers %}<p>Add a customer before registering a bike.</p><a class="button" href="/customer_new">Add Customer</a>{% else %}<div id="notice" class="record-notice" role="status" aria-live="polite" hidden></div>
<form id="record-form" class="record-form"><div class="wide"><label for="customer">Customer</label><select id="customer" name="customer" required><option value="">Choose customer</option>{% for item in customers %}<option value="{{ item.name|e }}">{{ item.customer_name|e }}</option>{% endfor %}</select></div><div><label for="registration_no">Registration number</label><input id="registration_no" name="registration_no" maxlength="140" required></div><div><label for="bike_brand">Brand</label><select id="bike_brand" name="bike_brand"><option value="">Not specified</option><option>Hero</option><option>Honda</option><option>Bajaj</option><option>TVS</option><option>Suzuki</option><option>Royal Enfield</option><option>Yamaha</option><option>KTM</option><option>Other</option></select></div><div><label for="bike_model">Model</label><input id="bike_model" name="bike_model" maxlength="140" required></div><div><label for="year">Year</label><input id="year" name="year" type="number" min="0" step="1"></div><div><label for="color">Color</label><input id="color" name="color" maxlength="140"></div><div><label for="engine_no">Engine number</label><input id="engine_no" name="engine_no" maxlength="140"></div><div><label for="chassis_no">Chassis number</label><input id="chassis_no" name="chassis_no" maxlength="140"></div><div><label for="km_reading">Current KM reading</label><input id="km_reading" name="km_reading" type="number" min="0" step="1"></div><div><label for="last_service_date">Last service date</label><input id="last_service_date" name="last_service_date" type="date"></div><div class="wide"><label for="notes">Notes</label><textarea id="notes" name="notes" maxlength="2000"></textarea></div><div class="wide record-actions"><button id="submit" type="submit">Save Bike</button><a id="open-record" class="button" hidden>Open Bike</a><a class="button" href="/garage">Cancel</a></div></form>{% endif %}</section></main>
{% if customers %}<script>
const form=document.getElementById('record-form'),notice=document.getElementById('notice'),button=document.getElementById('submit');
form.addEventListener('submit',async event=>{event.preventDefault();notice.hidden=true;button.disabled=true;try{const response=await fetch('/api/method/bike_garage.bike_garage.api.bikes.create_bike',{method:'POST',credentials:'same-origin',headers:{'X-Frappe-CSRF-Token':document.querySelector('meta[name="csrf-token"]').content},body:new FormData(form)});const payload=await response.json();if(!response.ok||payload.exc||payload.exc_type)throw new Error('Unable to save this bike. Verify the selected customer and entered details.');notice.textContent='Bike saved.';notice.className='record-notice success';notice.hidden=false;const link=document.getElementById('open-record');link.href='/bike_view?name='+encodeURIComponent(payload.message.name);link.hidden=false}catch(error){notice.textContent=error.message;notice.className='record-notice error';notice.hidden=false}finally{button.disabled=false}});
</script>{% endif %}</body></html>
