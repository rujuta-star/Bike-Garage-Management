<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token|e }}"><title>{{ title|e }}</title><link rel="stylesheet" href="/assets/bike_garage/css/garage_ui.css">
<style>.record-form{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.record-form .wide{grid-column:1/-1}.record-form label{display:block;font-weight:600;margin:16px 0 6px}.record-form input,.record-form select,.record-form textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd3dc;border-radius:6px;font:inherit}.record-form textarea{min-height:90px}.record-notice{padding:12px;margin:12px 0;border-radius:6px}.record-notice.error{background:#fff0ef;color:#8b1a12}.record-notice.success{background:#e9f7ee;color:#14532d}.record-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}@media(max-width:560px){.record-form{grid-template-columns:1fr}.record-form .wide{grid-column:auto}}</style></head>
<body class="bg-job-page"><main class="bg-job-shell"><a class="bg-job-back" href="/garage">← Back to Dashboard</a><section class="bg-job-panel"><h1>Add Customer</h1><div id="notice" class="record-notice" role="status" aria-live="polite" hidden></div>
<form id="record-form" class="record-form"><div><label for="customer_name">Customer name</label><input id="customer_name" name="customer_name" maxlength="140" required></div><div><label for="phone">Phone number</label><input id="phone" name="phone" maxlength="40" required></div><div><label for="email">Email (optional)</label><input id="email" name="email" type="email" maxlength="140"></div><div><label for="gender">Gender (optional)</label><select id="gender" name="gender"><option value="">Not specified</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="wide"><label for="address">Address</label><textarea id="address" name="address" maxlength="2000"></textarea></div><div><label for="date_of_birth">Date of birth</label><input id="date_of_birth" name="date_of_birth" type="date"></div><div class="wide"><label for="notes">Notes</label><textarea id="notes" name="notes" maxlength="2000"></textarea></div><div class="wide record-actions"><button id="submit" type="submit">Save Customer</button><a id="open-record" class="button" hidden>Open Customer</a><a class="button" href="/garage">Cancel</a></div></form>
</section></main><script>
const form=document.getElementById('record-form'),notice=document.getElementById('notice'),button=document.getElementById('submit');
form.addEventListener('submit',async event=>{event.preventDefault();notice.hidden=true;button.disabled=true;try{const response=await fetch('/api/method/bike_garage.bike_garage.api.customers.create_customer',{method:'POST',credentials:'same-origin',headers:{'X-Frappe-CSRF-Token':document.querySelector('meta[name="csrf-token"]').content},body:new FormData(form)});const payload=await response.json();if(!response.ok||payload.exc||payload.exc_type)throw new Error('Unable to save this customer. Check the details and try again.');notice.textContent='Customer saved.';notice.className='record-notice success';notice.hidden=false;const link=document.getElementById('open-record');link.href='/customer_view?name='+encodeURIComponent(payload.message.name);link.hidden=false}catch(error){notice.textContent=error.message;notice.className='record-notice error';notice.hidden=false}finally{button.disabled=false}});
</script></body></html>
