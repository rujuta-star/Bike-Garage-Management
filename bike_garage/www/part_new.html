<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token|e }}"><title>{{ title|e }}</title><link rel="stylesheet" href="/assets/bike_garage/css/garage_ui.css">
<style>.record-form{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.record-form .wide{grid-column:1/-1}.record-form label{display:block;font-weight:600;margin:16px 0 6px}.record-form input,.record-form select,.record-form textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd3dc;border-radius:6px;font:inherit}.record-form textarea{min-height:90px}.record-notice{padding:12px;margin:12px 0;border-radius:6px}.record-notice.error{background:#fff0ef;color:#8b1a12}.record-notice.success{background:#e9f7ee;color:#14532d}.record-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}@media(max-width:560px){.record-form{grid-template-columns:1fr}.record-form .wide{grid-column:auto}}</style></head>
<body class="bg-job-page"><main class="bg-job-shell"><a class="bg-job-back" href="/garage">← Back to Dashboard</a><section class="bg-job-panel"><h1>Add Spare Part</h1><p>New catalog entries start at zero stock. Use <a href="/stock_receive">Receive / Adjust Stock</a> to record inventory.</p><div id="notice" class="record-notice" role="status" aria-live="polite" hidden></div>
<form id="record-form" class="record-form"><div class="wide"><label for="part_name">Part name</label><input id="part_name" name="part_name" maxlength="140" required></div><div><label for="category">Category</label><select id="category" name="category"><option value="">Not specified</option><option>Lubricant</option><option>Brakes</option><option>Filter</option><option>Ignition</option><option>Drive</option><option>Electrical</option><option>Body</option><option>Suspension</option><option>Controls</option><option>Other</option></select></div><div><label for="brand">Brand</label><input id="brand" name="brand" maxlength="140"></div><div><label for="purchase_price">Purchase price (optional)</label><input id="purchase_price" name="purchase_price" type="number" min="0" step="0.01"></div><div><label for="selling_price">Selling price</label><input id="selling_price" name="selling_price" type="number" min="0" step="0.01" required></div><div><label for="gst_rate">GST rate</label><select id="gst_rate" name="gst_rate"><option>0</option><option>5</option><option>12</option><option selected>18</option><option>28</option></select></div><div><label for="min_stock_qty">Reorder level</label><input id="min_stock_qty" name="min_stock_qty" type="number" min="0" step="0.01" value="5"></div><div><label for="unit">Unit</label><select id="unit" name="unit"><option>Pcs</option><option>Litre</option><option>Set</option><option>Pair</option><option>Kg</option><option>Metre</option></select></div><div class="wide"><label for="description">Description</label><textarea id="description" name="description" maxlength="2000"></textarea></div><div class="wide record-actions"><button id="submit" type="submit">Save Part</button><a class="button" href="/garage">Back to Dashboard</a></div></form>
</section></main><script>
const form=document.getElementById('record-form'),notice=document.getElementById('notice'),button=document.getElementById('submit');
form.addEventListener('submit',async event=>{event.preventDefault();notice.hidden=true;button.disabled=true;try{const response=await fetch('/api/method/bike_garage.bike_garage.api.spare_parts.create_spare_part',{method:'POST',credentials:'same-origin',headers:{'X-Frappe-CSRF-Token':document.querySelector('meta[name="csrf-token"]').content},body:new FormData(form)});const payload=await response.json();if(!response.ok||payload.exc||payload.exc_type)throw new Error('Unable to save this part. Check the details and try again.');notice.textContent='Part saved with zero stock.';notice.className='record-notice success';notice.hidden=false}catch(error){notice.textContent=error.message;notice.className='record-notice error';notice.hidden=false}finally{button.disabled=false}});
</script></body></html>
